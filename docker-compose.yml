services:

  api:
    image: atnaveen/job-market-intelligence:1.0.0
    container_name: job-market-intelligence-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PYTHONPATH: /app
      PREFECT_API_URL: http://prefect-server:4200/api
    ports:
      - "8080:8000"
    depends_on:
      prefect-server:
        condition: service_healthy

  prefect-migrate:
    image: prefecthq/prefect:3.8-python3.12
    container_name: adi-prefect-migrate
    profiles:
      - migrations
    restart: "no"
    environment:
      PREFECT_SERVER_DATABASE_CONNECTION_URL: ${PREFECT_DATABASE_URL}
    command:
      - prefect
      - server
      - database
      - upgrade
      - -y

  prefect-server:
    image: prefecthq/prefect:3.8-python3.12
    container_name: jmip-prefect-server
    restart: unless-stopped
    command:
      - prefect
      - server
      - start
      - --host
      - 0.0.0.0
      - --no-services
    environment:
      PREFECT_SERVER_DATABASE_CONNECTION_URL: ${PREFECT_DATABASE_URL}
      PREFECT_SERVER_DATABASE_MIGRATE_ON_START: "false"
      PREFECT_UI_API_URL: ${PREFECT_UI_API_URL}
      PREFECT_SERVER_DATABASE_SQLALCHEMY_POOL_SIZE: "2"
      PREFECT_SERVER_DATABASE_SQLALCHEMY_MAX_OVERFLOW: "0"
    ports:
      - "4200:4200"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4200/api/health')"
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  prefect-services:
    image: prefecthq/prefect:3.8-python3.12
    container_name: adi-prefect-services
    restart: unless-stopped
    command:
      - prefect
      - server
      - services
      - start
    environment:
      PREFECT_SERVER_DATABASE_CONNECTION_URL: ${PREFECT_DATABASE_URL}
      PREFECT_SERVER_DATABASE_MIGRATE_ON_START: "false"
      PREFECT_SERVER_DATABASE_SQLALCHEMY_POOL_SIZE: "2"
      PREFECT_SERVER_DATABASE_SQLALCHEMY_MAX_OVERFLOW: "0"
    depends_on:
      prefect-server:
        condition: service_healthy

  prefect-worker:
    image: atnaveen/job-market-intelligence:1.0.0
    container_name: adi-prefect-worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PYTHONPATH: /app
      PREFECT_API_URL: http://prefect-server:4200/api
    command:
      - prefect
      - worker
      - start
      - --pool
      - adi-process-pool
      - --type
      - process
    depends_on:
      prefect-server:
        condition: service_healthy
