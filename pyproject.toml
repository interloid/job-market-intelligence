[project]
name = "automated-data-intelligence-platform-job-portal"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "naveen-interloid", email = "naveen@interloid.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "fastapi>=0.162.0",
    "greenlet>=3.5.6",
    "pydantic-settings>=2.16.1",
    "sqlalchemy>=2.1.6",
    "uuid6>=2025.0.1",
    "uvicorn[standard]>=0.54.0",
]
[dependency-groups]
dev = [
    "ruff>=0.14.0",
    "mypy>=2.4.1",
]

[tool.uv.build-backend]
module-name = "app"
module-root = "src"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

# pyproject.toml
[tool.mypy]
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true

